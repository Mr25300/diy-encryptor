name: Run Tests

on:
  push:
    branches: [ "*" ]
  pull_requests:
    branches: [ "*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies / Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Run Make Test
        run: make test
